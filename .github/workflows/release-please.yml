name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Keep manual option for emergency use

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write  # Required for artifact attestations
  attestations: write  # Required for artifact attestations

jobs:
  release-please:
    name: Create Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Use PAT to trigger CI workflows on Release PRs
          # See: https://github.com/googleapis/release-please-action#github-credentials
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Debug Release-Please outputs
        env:
          RP_RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          RP_PRS_CREATED: ${{ steps.release.outputs.prs_created }}
          RP_PR: ${{ steps.release.outputs.pr }}
          RP_PRS: ${{ steps.release.outputs.prs }}
        run: |
          echo "releases_created: $RP_RELEASES_CREATED"
          echo "prs_created: $RP_PRS_CREATED"
          echo "pr: $RP_PR"
          echo "prs: $RP_PRS"

      # If a release was created, build and sign artifacts
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v4.0.1
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: true

      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: npm run build

      - name: Create distribution archive
        if: ${{ steps.release.outputs.release_created }}
        run: tar czf qrtak-dist.tgz dist

      - name: Generate artifact attestation
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: '${{ github.workspace }}/qrtak-dist.tgz'

      - name: Upload release assets
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ steps.release.outputs.tag_name }} \
            qrtak-dist.tgz \
            --clobber
